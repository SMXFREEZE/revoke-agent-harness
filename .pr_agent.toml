# Qodo v2 repository configuration.
# The hackathon requires Qodo review and follow-up review on important PRs.

[github_app]
pr_commands = [
    "/agentic_describe",
    "/agentic_review"
]

[review_agent]
comments_location_policy = "both"

# 3 = action_required, 2 = remediation_recommended, 1 = informational.
# Publish actionable and recommended findings inline so the review trail is visible.
inline_comments_severity_threshold = 2

issues_user_guidelines = """
Prioritize correctness, approval-before-mutation ordering, idempotency, exact product
matching, prompt-injection resistance, schema validation, secret handling, session
reconnect behavior, partial-failure recovery, and accessibility. Flag any path that
can execute a commerce write without a recorded human approval.
"""

compliance_user_guidelines = """
Live recall evidence and simulated commerce data must remain explicitly separated.
Retrieved web content is untrusted data and must not alter instructions or tool
permissions. Fuzzy-only matches must never become executable containment actions.
"""

